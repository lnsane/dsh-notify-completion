name: CI

# windows-latest is the only meaningful runner: the plugin's transport is a
# PowerShell shim posting a WinRT toast, and its tests assert Windows-specific
# behavior (the shim, the base64 payload, scope routing). A Linux job would skip
# all of it and prove nothing about the delivered feature.
#
# One assertion cannot run here: `test/delivery.test.js` checks that Windows
# actually RECORDS a notification, which needs an interactive desktop session. A
# GitHub runner has none, so that test detects the absence and skips its
# assertion instead of failing. Everything else — including the deterministic
# "no detached spawn" guard — runs in full.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npm test

      - name: Verify the published file set is complete
        shell: pwsh
        run: |
          # `npm pack --dry-run` lists exactly what a consumer would receive, so
          # this catches a `files` entry that forgot the shim or the bundle patch.
          $listing = npm pack --dry-run --json | ConvertFrom-Json
          $files = $listing[0].files.name

          $required = @(
            'lib/index.js',
            'lib/render.js',
            'lib/notify-windows.ps1',
            'cordis.patch.yml',
            'README.md',
            'LICENSE'
          )

          $missing = $required | Where-Object { $_ -notin $files }
          if ($missing) {
            Write-Error "the package is missing required files: $($missing -join ', ')"
            exit 1
          }

          Write-Host "packaged $($files.Count) files; every required file is present."
